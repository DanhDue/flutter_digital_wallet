name: d3_wallet
description: "D3 Wallet project."
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  theme_tailor_annotation: ^3.1.2
  flutter_svg: ^2.1.0
  google_sign_in: ^7.2.0
  fimber: ^0.7.0
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  hive_ce: any
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  lottie: ^3.3.0
  connectivity_plus: ^7.0.0
  flutter_keyboard_visibility: ^6.0.0
  path_provider: ^2.1.5
  path_provider_android: ^2.2.17
  path_provider_foundation: ^2.4.1
  http_mock_adapter: ^0.6.1
  flutter_local_notifications: ^19.1.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  local_auth: ^3.0.0
  flutter_easyloading: ^3.0.5
  url_launcher: ^6.3.1
  dart_extensions: ^2.2.4
  dart_style: ^3.0.1
  animated_bottom_navigation_bar: ^1.4.0
  bip39: ^1.0.6
  equatable: ^2.0.7
  # jiffy: 6.4.4
  hive_ce_flutter: any
  flutter_secure_storage: ^10.0.0
  pretty_qr_code: ^3.4.0
  mobile_scanner: ^7.0.0
  flutter_native_splash: ^2.4.4
  slider_button: ^2.1.0
  flutter_hooks: ^0.21.2
  auto_size_text: ^3.0.0
  animated_item: ^0.0.2
  dart_helper_utils: ^5.1.0
  persistent_bottom_nav_bar_v2: ^6.2.0
  image_picker: ^1.1.2
  focus_detector: ^2.0.1
  flutter_boring_avatars: ^2.0.1
  currency_text_input_formatter: ^2.3.0
  flutter_masked_text2: ^0.9.1
  modal_bottom_sheet: ^3.0.0
  firebase_core: ^4.3.0
  firebase_in_app_messaging: ^0.9.0+5
  firebase_messaging: ^16.1.0
  firebase_crashlytics: ^5.0.6
  number_text_input_formatter: ^1.0.0+8
  loading_animation_widget: ^1.3.0
  package_info_plus: ^9.0.0
  device_region: ^1.4.0
  material_text_fields: ^1.0.6
  share_plus: ^12.0.1
  image_gallery_saver_plus: ^4.0.1
  flutter_html: ^3.0.0
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0
  flutter_smart_dialog: ^4.9.8+9
  overlay_support: ^2.1.0
  talker_flutter: ^5.0.0
  talker_dio_logger: ^5.0.0
  animated_visibility: ^0.0.4
  animated_text_kit: ^4.2.3
  pretty_animated_text: ^2.0.0
  smooth_page_indicator: ^2.0.1
  dotted_decoration: ^2.0.0
  dotted_border: ^3.1.0
  permission_handler: ^12.0.1
  back_button_interceptor: ^8.0.4
  card_swiper: ^3.0.1

dependency_overrides: 
  retrofit:
    git:
      url: https://github.com/DanhDue/retrofit.dart.git
      ref: analyzer
      path: retrofit

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  get_cli: 
    git: 
      url: https://github.com/DanhDue-ExOICTIF/get_cli.git
      ref: upgrade-dart-style-version
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0
  retrofit_generator:
    git:
      url: https://github.com/DanhDue/retrofit.dart.git
      ref: analyzer
      path: generator
  freezed:
    git:
      url: https://github.com/D3FOutsourcing/freezed
      ref: analyzer
      path: packages/freezed
  json_serializable: ^6.11.3
  theme_tailor: ^3.1.2
  melos: ^7.3.0
  mockito: ^5.4.6
  hive_ce_generator: any
  change_app_package_name: ^1.5.0
  source_gen: ^4.1.1
  build: ^4.0.3

dartfmt: 
  line_length: 99

flutter_gen: 
  output: lib/generated/
  integrations: 
    flutter_svg: true
    rive: false
    lottie: true
  assets: 
    outputs: 
      class_name: Assets
    enabled: true
  colors: 
    outputs: 
      class_name: AppColors
    inputs: 
      - assets/colors/colors.xml
    enabled: true
  fonts: 
    outputs: 
      class_name: AppFontFamily
      package_parameter_enabled: true
    enabled: true
  line_length: 99

flutter:
  uses-material-design: true
  assets: 
    - assets/images/
    - assets/lotties/
    - assets/jsons/
  fonts: 
    - family: SfCompactRegular
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Regular.ttf
    - family: SfCompactMedium
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Medium.ttf
    - family: SfCompactSemiBold
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Semibold.ttf
    - family: SfCompactBold
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Bold.ttf
